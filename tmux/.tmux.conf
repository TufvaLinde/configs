# Splitting panes

# Remapping movement keys
bind h select-pane -L                   # Move focus to pane on the left
bind j select-pane -D                   # Move focus to pane above the current one
bind k select-pane -U                   # Move focus to pane below the current one
bind l select-pane -R                   # Move focus to pane on the right
bind -r C-h select-window -t :-         # Move to previous window
bind -r C-l select-window -t :+         # Move to next window

# Resizing panes (notes that is using the uppercase here and resize by 5 chars)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# Open new splits/windows in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Quality of life
set -g mouse on                         # click panes, drag borders, scroll
set -sg escape-time 10                  # no lag when pressing Esc in nvim
set -g base-index 1                     # windows start at 1 (easier to reach)
setw -g pane-base-index 1
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"
set -g allow-passthrough on             # lets images (tdf PDF view) through tmux
setw -g mode-keys vi                    # vim keys in copy mode (prefix [ )
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"
